<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HV Auto Glass">
  <!-- Favicon: the windshield mark from the logo, without the wordmark or the
       side mirrors. The full lockup turns to mush at 16px, and the mirrors
       read as specks at that size, so the glass is scaled up to carry the
       whole mark on its own. Solid dark plate so it holds on light and dark
       browser chrome alike. -->
  <rect width="64" height="64" rx="14" fill="#0B0E12"/>
  <path d="M7 50 L18 17 Q19.3 13 23.5 13 L40.5 13 Q44.7 13 46 17 L57 50 Z"
        fill="#FFC53D"/>
  <!-- wiper streaks, angled with the glass -->
  <g stroke="#0B0E12" stroke-width="4.6" stroke-linecap="round">
    <line x1="38" y1="44" x2="45" y2="21"/>
    <line x1="28.5" y1="44" x2="35.5" y2="21"/>
  </g>
</svg>
